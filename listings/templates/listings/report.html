{% extends "core/base.html" %}
{% block title %}Report Listing — Basera{% endblock %}
{% block content %}
<div style="max-width:500px; margin:40px auto; background:white; padding:32px; border-radius:8px;">
    <h2 style="margin-bottom:8px;">Report This Listing</h2>
    <p style="color:#666; font-size:14px; margin-bottom:24px;">{{ listing.title }}</p>

    <form method="post">
        {% csrf_token %}
        <div style="margin-bottom:16px;">
            <label style="display:block; margin-bottom:8px; font-size:14px; font-weight:bold;">Reason</label>
            {% for value, label in reasons %}
                <label style="display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:14px; cursor:pointer;">
                    <input type="radio" name="reason" value="{{ value }}" required>
                    {{ label }}
                </label>
            {% endfor %}
        </div>
        <div style="margin-bottom:20px;">
            <label style="display:block; margin-bottom:6px; font-size:14px; font-weight:bold;">Additional Details (optional)</label>
            <textarea name="details" rows="4"
                style="width:100%; padding:10px; border:1px solid #ddd; border-radius:4px; font-size:14px; resize:vertical;"
                placeholder="Describe the issue..."></textarea>
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Submit Report</button>
        <a href="{% url 'listing_detail' listing.id %}"
           style="display:block; text-align:center; margin-top:12px; color:#666; font-size:14px;">Cancel</a>
    </form>
</div>
{% endblock %}
